
# GitHub Actions Workflow:
#Intelligent Bus Driver Guidance System
# Automatically builds and runs all JUnit 5 tests on every
# push or pull request to the main/master branch.


name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up for Java 17 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compiles
      - name: Build with Maven
        run: mvn -B clean compile --file pom.xml

      # Step 4: Run all unit tests
      - name: Run Unit and Integration Tests
        run: mvn -B test --file pom.xml

      # Step 5:
      # (runs even if tests fail)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
